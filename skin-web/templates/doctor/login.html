{% extends "base.html" %}
{% block title %}Đăng nhập Bác sĩ — SkinScan{% endblock %}

{% block content %}
<div class="login-wrap">
  <div class="login-box glass-2">
    <div class="login-title">👨‍⚕️ Đăng nhập</div>
    <p class="login-sub">Dành cho bác sĩ da liễu — SkinScan</p>

    {% if error %}
    <div class="login-error">⚠️ {{ error }}</div>
    {% endif %}

    <form class="login-form" method="POST" action="{{ url_for('doctor.login') }}">
      <div class="form-group">
        <label class="form-label" for="username">Tên đăng nhập</label>
        <input type="text" class="form-control" id="username" name="username"
               placeholder="doctor" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu</label>
        <input type="password" class="form-control" id="password" name="password"
               placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">
        Đăng nhập →
      </button>
    </form>

    <div class="mt-3 text-center" style="font-size:0.8rem;color:var(--clr-text-dim)">
      <a href="{{ url_for('patient.index') }}" style="color:var(--clr-text-muted);text-decoration:none">
        ← Quay lại trang bệnh nhân
      </a>
    </div>
  </div>
</div>
{% endblock %}
